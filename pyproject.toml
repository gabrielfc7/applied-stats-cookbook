[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-stats-cookbook"
version = "0.1.0"
description = "A computational reference and toolkit for applied statistical inference, parametric/non-parametric hypothesis testing, ANOVA, and resampling methods with publication-ready reporting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gabriel", email = "gabriel@example.com" }
]
keywords = [
    "statistics",
    "hypothesis-testing",
    "anova",
    "non-parametric",
    "bootstrap",
    "permutation-tests",
    "effect-size",
    "publication-reporting"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.5.0"
]

[project.scripts]
stats-cookbook = "applied_stats.reporting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
pythonpath = ["src"]
